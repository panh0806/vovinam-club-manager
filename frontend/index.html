<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý CLB Vovinam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; margin: auto; }
        .btn { padding: 10px 15px; color: white; border: none; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .btn-blue { background: #0d6efd; }
        .btn-green { background: #198754; }
        .btn-orange { background: #fd7e14; }
        .btn-red { background: #dc3545; }
        .input-box { padding: 9px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        .section { padding: 20px; margin-top: 20px; border-radius: 8px; border: 1px solid; }
        /* CSS Ẩn/Hiện phân quyền */
        #mainContent { display: none; }
        #userSection { background-color: #e8f5e9; border-color: #c8e6c9; }
        #adminSection { display: none; background-color: #ffebee; border-color: #ffcdd2; margin-top: 20px; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">🥋 Hệ thống Quản lý CLB Vovinam</h2>
    
    <div style="text-align: center; margin-bottom: 30px;">
        <button id="connectBtn" class="btn btn-blue" style="font-size: 16px;">Kết nối Ví MetaMask</button>
        <p>Ví đang kết nối: <strong id="walletAddress" style="color: red;">Chưa kết nối</strong></p>
        <p>Vai trò hệ thống: <strong id="userRole" style="color: gray;">Chưa xác định</strong></p>
    </div>

    <!-- KHU VỰC CHỨA CÁC TÍNH NĂNG (Bị ẩn khi chưa kết nối ví) -->
    <div id="mainContent">
        
        <!-- PHẦN DÀNH CHO THÀNH VIÊN (Ai kết nối ví cũng thấy) -->
        <div id="userSection" class="section">
            <h3 style="color: #198754; margin-top: 0;">👤 Khu vực Thành viên</h3>
            <hr>
            <h4>1. Điểm danh buổi tập</h4>
            <button id="checkInBtn" class="btn btn-green">Điểm danh ngay</button>
            
            <h4 style="margin-top: 25px;">2. Đóng quỹ CLB</h4>
            <input type="number" id="fundAmount" class="input-box" placeholder="Số lượng ETH (VD: 0.01)">
            <button id="depositBtn" class="btn btn-orange">Đóng quỹ</button>
        </div>

        <!-- PHẦN DÀNH CHO BAN CHỦ NHIỆM (Chỉ Admin mới thấy) -->
        <div id="adminSection" class="section">
            <h3 style="color: #dc3545; margin-top: 0;">👑 Khu vực Ban chủ nhiệm</h3>
            <hr>
            <h4>Rút quỹ tổ chức sự kiện</h4>
            <input type="number" id="withdrawAmount" class="input-box" placeholder="Số lượng ETH cần rút">
            <button id="withdrawBtn" class="btn btn-red">Rút quỹ CLB</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
