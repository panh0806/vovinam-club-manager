<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý CLB Vovinam</title>
    <!-- Thư viện Ethers.js dùng để kết nối Web với Blockchain -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h2>Hệ thống Quản lý CLB Vovinam</h2>
    
    <button id="connectBtn" style="padding: 10px; background: blue; color: white; border: none; cursor: pointer;">Kết nối Ví MetaMask</button>
    <p>Ví đang kết nối: <strong id="walletAddress" style="color: red;">Chưa kết nối</strong></p>
    
    <hr>
    
    <h3>1. Điểm danh buổi tập</h3>
    <button id="checkInBtn" style="padding: 10px; background: green; color: white; border: none; cursor: pointer;">Điểm danh ngay</button>
    
    <h3>2. Đóng quỹ CLB</h3>
    <input type="number" id="fundAmount" placeholder="Số lượng ETH (VD: 0.01)" style="padding: 10px; margin-right: 10px;">
    <button id="depositBtn" style="padding: 10px; background: orange; color: white; border: none; cursor: pointer;">Đóng quỹ</button>

    <!-- Nạp file logic app.js vào web -->
    <script src="app.js"></script>
</body>
</html>
